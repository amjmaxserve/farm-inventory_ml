name: Farm Inventory CI

on:

  push:

    branches:
      - main
      - phase4-production

  pull_request:

    branches:
      - main

jobs:

  test:

    runs-on: self-hosted

    env:

      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}

      MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}

      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_HEALTH_URL: ${{ secrets.MLFLOW_HEALTH_URL }}
      MINIO_HEALTH_URL: ${{ secrets.MINIO_HEALTH_URL }}

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Verify Runner

        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working Directory: $(pwd)"
          docker --version
          docker-compose --version

      - name: Verify Environment Variables

        run: |
          test -n "$POSTGRES_USER" && echo "POSTGRES_USER OK"
          test -n "$POSTGRES_HOST" && echo "POSTGRES_HOST OK"
          test -n "$POSTGRES_PORT" && echo "POSTGRES_PORT OK"
          test -n "$POSTGRES_DB" && echo "POSTGRES_DB OK"

          test -n "$MINIO_ENDPOINT" && echo "MINIO_ENDPOINT OK"
          test -n "$MODEL_BUCKET" && echo "MODEL_BUCKET OK"

          test -n "$MLFLOW_TRACKING_URI" && echo "MLFLOW_TRACKING_URI OK"
          test -n "$MLFLOW_HEALTH_URL" && echo "MLFLOW_HEALTH_URL OK"
          test -n "$MINIO_HEALTH_URL" && echo "MINIO_HEALTH_URL OK"

      - name: Build Test Image

        run: |
          docker-compose build test

      - name: Run Flake8

        run: |
          docker-compose run --rm test flake8 .

      - name: Run Pytest

        run: |
          docker-compose run --rm test