name: Farm Inventory CI

on:
  push:
    branches:
      - main
      - phase4-production

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Build Test Image
        run: docker-compose build test

      - name: Run Flake8
        run: docker-compose run --rm test flake8 .

      - name: Run Pytest
        run: docker-compose run --rm test