name: Farm Inventory CI

on:
  push:
    branches:
      - main
      - phase4-production

  pull_request:
    branches:
      - main

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

  MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
  MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
  MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}

  MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}

  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_HEALTH_URL: ${{ secrets.MLFLOW_HEALTH_URL }}
  MINIO_HEALTH_URL: ${{ secrets.MINIO_HEALTH_URL }}

jobs:

  verify:

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Runner
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working Directory: $(pwd)"
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker-compose --version

  
  verify-environment-variables:
    runs-on: self-hosted

    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Environment Variables
        run: |
          echo "Verifying Environment Variables..."
          test -n "$POSTGRES_USER" && echo "POSTGRES_USER ok"
          test -n "$POSTGRES_PASSWORD" && echo "POSTGRES_PASSWORD ok"
          test -n "$POSTGRES_DB" && echo "POSTGRES_DB ok"
          test -n "$POSTGRES_HOST" && echo "POSTGRES_HOST ok"
          test -n "$POSTGRES_PORT" && echo "POSTGRES_PORT ok"
          test -n "$MINIO_ROOT_USER" && echo "MINIO_ROOT_USER ok"
          test -n "$MINIO_ROOT_PASSWORD" && echo "MINIO_ROOT_PASSWORD ok"
          test -n "$MINIO_ENDPOINT" && echo "MINIO_ENDPOINT ok"
          test -n "$MODEL_BUCKET" && echo "MODEL_BUCKET ok"
          test -n "$MLFLOW_TRACKING_URI" && echo "MLFLOW_TRACKING_URI ok"
          test -n "$MLFLOW_HEALTH_URL" && echo "MLFLOW_HEALTH_URL ok"
          test -n "$MINIO_HEALTH_URL" && echo "MINIO_HEALTH_URL ok"
  
  run-flaske8:
    runs-on: self-hosted
    needs: verify-environment-variables
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run flake8
        run: |
          docker-compose run --rm test flake8 .

  
  verify-Admin-User:
    runs-on: self-hosted
    needs: run-flaske8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Admin User
        run: |
          docker-compose run --rm test python -c "
          from app.database.db import SessionLocal
          from app.database.models import User
          db = SessionLocal()
          user = db.query(User).filter(User.is_admin == True).first()
          
          print('Admin user exists: ', user is not None)"
  
  Build-test-image:
    runs-on: self-hosted
    needs: verify-Admin-User
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Test Image
        run: |
          docker-compose build test

  pytest:
    runs-on: self-hosted
    needs: run-flaske8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run pytest
        run: |
          docker-compose run --rm test