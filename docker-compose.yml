version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: farm_postgres

    environment:
      POSTGRES_USER: farmadmin
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: farm_inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: