version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: farm_postgres

    environment:
      POSTGRES_USER: farmadmin
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: farm_inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: farm_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

    restart: unless-stopped


  nginx:
    image: nginx:latest
    container_name: farm_nginx

    ports:
      - "80:80"

    depends_on:
      - fastapi
      - streamlit
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: farm_fastapi

    
    depends_on:
      - postgres

    restart: unless-stopped
  
  streamlit:
    build: 
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: farm_streamlit

    

    depends_on:
      - fastapi

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: