version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: farm_postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmadmin -d farm_inventory"]
      interval: 5s
      timeout: 5s
      retries: 20

    environment:
      POSTGRES_USER: farmadmin
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: farm_inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: farm_minio
    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

    restart: unless-stopped



  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    container_name: farm_mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 10s
      timeout: 5s
      retries: 20

    ports:
      - "5000:5000"

    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    command: >
      mlflow server
      --backend-store-uri postgresql://farmadmin:StrongPassword123@postgres:5432/farm_inventory
      --default-artifact-root s3://farm-inventory-model-registry/mlflow/
      --host 0.0.0.0
      --port 5000

    depends_on:
      - postgres
      - minio

    restart: unless-stopped


  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    container_name: farm_bootstrap

    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    restart: "no"


  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: farm_fastapi

    
    depends_on:
      bootstrap:
        condition: service_completed_successfully

    restart: unless-stopped
  
  streamlit:
    build: 
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: farm_streamlit

  

    depends_on:
      fastapi:
        condition: service_started

    restart: unless-stopped
  
  nginx:
    image: nginx:latest
    container_name: farm_nginx

    ports:
      - "80:80"

    depends_on:
      - fastapi
      - streamlit
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: